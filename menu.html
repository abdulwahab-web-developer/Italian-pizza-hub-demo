<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Menu — Italian Pizza Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0a;
        --bg-surface: #0f0f0f;
        --bg-card: #141414;
        --text: #ffffff;
        --text-secondary: #9a9a9a;
        --text-muted: #5a5a5a;
        --accent: #c9a44a;
        --accent-hover: #d4b55a;
        --accent-soft: rgba(201, 164, 74, 0.08);
        --border: rgba(255, 255, 255, 0.06);
        --border-hover: rgba(255, 255, 255, 0.12);
        --font-heading: "Playfair Display", Georgia, serif;
        --font-body: "DM Sans", -apple-system, sans-serif;
        --radius: 4px;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        font-size: 16px;
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
      }
      body {
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        overflow-x: hidden;
      }
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      ::selection {
        background: var(--accent);
        color: var(--bg);
      }
      .container {
        width: 100%;
        max-width: 1320px;
        margin: 0 auto;
        padding: 0 2rem;
      }

      /* NAVBAR */
      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 100;
        padding: 1.25rem 0;
        transition: all 0.4s ease;
      }
      .navbar.scrolled {
        background: rgba(10, 10, 10, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 0.9rem 0;
        border-bottom: 1px solid var(--border);
      }
      .nav-inner {
        max-width: 1320px;
        margin: 0 auto;
        padding: 0 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .nav-logo {
        font-family: var(--font-heading);
        font-size: 1.3rem;
        font-weight: 700;
        display: flex;
        align-items: baseline;
        gap: 0.25em;
      }
      .nav-logo .gold {
        color: var(--accent);
      }
      .nav-actions {
        display: flex;
        align-items: center;
        gap: 1.5rem;
      }
      .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem 1.6rem;
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: var(--text);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border-radius: var(--radius);
        transition: all 0.3s ease;
      }
      .btn-back:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn-back svg {
        transition: transform 0.3s;
      }
      .btn-back:hover svg {
        transform: translateX(-3px);
      }

      /* HERO */
      .menu-hero {
        padding: 8rem 0 5rem;
        text-align: center;
        position: relative;
      }
      .menu-hero::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 1px;
        height: 80px;
        background: linear-gradient(transparent, var(--accent), transparent);
      }
      .hero-label {
        font-size: 0.68rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
        margin-bottom: 1.25rem;
        display: block;
      }
      .hero-title {
        font-family: var(--font-heading);
        font-size: clamp(3rem, 7vw, 5rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
        margin-bottom: 1rem;
      }
      .hero-title em {
        font-style: italic;
        color: var(--accent);
        font-weight: 500;
      }
      .hero-desc {
        font-size: 0.95rem;
        color: var(--text-secondary);
        max-width: 420px;
        margin: 0 auto;
        letter-spacing: 0.02em;
        line-height: 1.6;
      }

      /* CATEGORY NAV */
      .cat-nav {
        position: sticky;
        top: 80px;
        z-index: 50;
        background: var(--bg);
        padding: 1rem 0;
        border-bottom: 1px solid var(--border);
        transition: top 0.4s ease;
      }
      .cat-nav.scrolled {
        top: 65px;
      }
      .cat-inner {
        max-width: 1320px;
        margin: 0 auto;
        padding: 0 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .cat-inner::-webkit-scrollbar {
        display: none;
      }
      .cat-btn {
        flex-shrink: 0;
        padding: 0.55rem 1.4rem;
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border: 1px solid transparent;
        border-radius: var(--radius);
        color: var(--text-secondary);
        transition: all 0.3s ease;
        white-space: nowrap;
      }
      .cat-btn:hover {
        color: var(--text);
        border-color: var(--border-hover);
      }
      .cat-btn.active {
        background: var(--accent);
        color: #0a0a0a;
        border-color: var(--accent);
        font-weight: 600;
      }

      /* MENU SECTIONS */
      .menu-sections {
        padding: 4rem 0 6rem;
      }
      .menu-section-block {
        margin-bottom: 5rem;
      }
      .menu-section-block:last-child {
        margin-bottom: 0;
      }
      .section-head {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        margin-bottom: 2.5rem;
      }
      .section-icon {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        background: var(--accent-soft);
        border-radius: var(--radius);
      }
      .section-name {
        font-family: var(--font-heading);
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .section-line {
        flex: 1;
        height: 1px;
        background: var(--border);
        margin-top: 0.25rem;
      }
      .section-count {
        font-size: 0.75rem;
        color: var(--text-muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      /* MENU GRID */
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
      }

      /* MENU CARD */
      .menu-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        position: relative;
        opacity: 0;
        transform: translateY(30px);
      }
      .menu-card.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .menu-card:hover {
        transform: translateY(-6px);
        border-color: rgba(201, 164, 74, 0.25);
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
      }
      .menu-card:hover .card-img img {
        transform: scale(1.06);
      }
      .card-img {
        aspect-ratio: 4/3;
        overflow: hidden;
        position: relative;
      }
      .card-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .card-badges {
        position: absolute;
        top: 0.75rem;
        left: 0.75rem;
        display: flex;
        gap: 0.35rem;
        flex-wrap: wrap;
      }
      .card-badge {
        padding: 0.2rem 0.55rem;
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-radius: 2px;
      }
      .badge-top {
        background: var(--accent);
        color: #0a0a0a;
      }
      .badge-veg {
        background: rgba(76, 175, 80, 0.9);
        color: #fff;
      }
      .badge-hot {
        background: rgba(244, 67, 54, 0.9);
        color: #fff;
      }
      .card-fav {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        border-radius: 50%;
        color: #fff;
        font-size: 0.9rem;
        transition: all 0.3s ease;
        opacity: 0;
      }
      .menu-card:hover .card-fav {
        opacity: 1;
      }
      .card-fav:hover {
        background: var(--accent);
        color: #0a0a0a;
      }
      .card-body {
        padding: 1.25rem;
      }
      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 0.5rem;
      }
      .card-name {
        font-family: var(--font-heading);
        font-size: 1.1rem;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .card-price {
        font-family: var(--font-heading);
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--accent);
        white-space: nowrap;
        margin-left: 0.75rem;
      }
      .card-desc {
        font-size: 0.8rem;
        color: var(--text-secondary);
        line-height: 1.5;
        margin-bottom: 1rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .card-stars {
        display: flex;
        gap: 0.08rem;
        color: var(--accent);
      }
      .card-tags {
        display: flex;
        gap: 0.35rem;
        flex-wrap: wrap;
      }
      .card-tag {
        font-size: 0.6rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 0.15rem 0.5rem;
        border-radius: 2px;
        background: var(--accent-soft);
        color: var(--accent);
        border: 1px solid rgba(201, 164, 74, 0.12);
      }
      .card-tag.veg-tag {
        background: rgba(76, 175, 80, 0.06);
        color: #66bb6a;
        border-color: rgba(76, 175, 80, 0.12);
      }
      .card-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .btn-card {
        flex: 1;
        padding: 0.65rem 1rem;
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border-radius: var(--radius);
        text-align: center;
        transition: all 0.3s ease;
      }
      .btn-add-card {
        background: var(--accent);
        color: #0a0a0a;
      }
      .btn-add-card:hover {
        background: var(--accent-hover);
        box-shadow: 0 8px 24px rgba(201, 164, 74, 0.2);
      }
      .btn-detail-card {
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--text-secondary);
      }
      .btn-detail-card:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn-add-card.added {
        background: #4caf50;
        color: #fff;
        pointer-events: none;
      }

      /* POPUP */
      .popup-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(12px);
        z-index: 200;
        opacity: 0;
        visibility: hidden;
        transition: all 0.4s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .popup-overlay.active {
        opacity: 1;
        visibility: visible;
      }
      .popup {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        width: 100%;
        max-width: 560px;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
        transform: translateY(40px) scale(0.94);
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .popup-overlay.active .popup {
        transform: translateY(0) scale(1);
      }
      .popup-close {
        position: absolute;
        top: 1rem;
        right: 1rem;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        color: #fff;
        transition: all 0.3s ease;
      }
      .popup-close:hover {
        background: var(--accent);
        color: #0a0a0a;
      }
      .popup-img {
        aspect-ratio: 16/10;
        overflow: hidden;
      }
      .popup-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .popup-body {
        padding: 1.75rem;
      }
      .popup-cat {
        font-size: 0.65rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      .popup-name {
        font-family: var(--font-heading);
        font-size: 1.75rem;
        font-weight: 700;
        line-height: 1.1;
        margin-bottom: 0.75rem;
        letter-spacing: -0.02em;
      }
      .popup-rating {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .popup-stars {
        display: flex;
        gap: 0.1rem;
        color: var(--accent);
      }
      .popup-reviews {
        font-size: 0.8rem;
        color: var(--text-muted);
      }
      .popup-desc {
        font-size: 0.9rem;
        color: var(--text-secondary);
        line-height: 1.7;
        margin-bottom: 1.5rem;
      }
      .popup-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      .popup-info-item {
        background: var(--bg-card);
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        border: 1px solid var(--border);
      }
      .popup-info-label {
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 0.2rem;
      }
      .popup-info-value {
        font-size: 0.85rem;
        font-weight: 500;
      }
      .popup-footer {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
      }
      .popup-price {
        font-family: var(--font-heading);
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--accent);
        white-space: nowrap;
      }
      .popup-qty {
        display: flex;
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .qty-btn-popup {
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        font-weight: 600;
        transition: all 0.2s ease;
        color: var(--text);
      }
      .qty-btn-popup:hover {
        background: var(--accent);
        color: #0a0a0a;
      }
      .qty-val {
        width: 36px;
        text-align: center;
        font-weight: 600;
        font-size: 0.85rem;
      }
      .btn-popup-add {
        flex: 1;
        padding: 0.75rem 1.5rem;
        background: var(--accent);
        color: #0a0a0a;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-radius: var(--radius);
        transition: all 0.3s ease;
      }
      .btn-popup-add:hover {
        background: var(--accent-hover);
      }
      .btn-popup-add.added {
        background: #4caf50;
        color: #fff;
        pointer-events: none;
      }

      /* TOAST */
      .toast {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        z-index: 300;
        padding: 0.9rem 1.5rem;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        transition: all 0.4s ease;
        opacity: 0;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 0.65rem;
        font-size: 0.85rem;
        font-weight: 500;
      }
      .toast.active {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
      .toast-dot {
        width: 8px;
        height: 8px;
        background: var(--accent);
        border-radius: 50%;
      }

      /* EMPTY */
      .empty-state {
        text-align: center;
        padding: 5rem 2rem;
        display: none;
      }
      .empty-state.show {
        display: block;
      }
      .empty-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
        opacity: 0.4;
      }
      .empty-title {
        font-family: var(--font-heading);
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }

      /* FOOTER */
      .footer {
        padding: 2.5rem 0;
        text-align: center;
        border-top: 1px solid var(--border);
      }
      .footer p {
        font-size: 0.75rem;
        color: var(--text-muted);
        letter-spacing: 0.04em;
      }

      /* RESPONSIVE */
      @media (max-width: 1024px) {
        .menu-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 768px) {
        .container,
        .nav-inner,
        .cat-inner {
          padding-left: 1.25rem;
          padding-right: 1.25rem;
        }
        .menu-hero {
          padding: 7rem 0 3.5rem;
        }
        .hero-title {
          font-size: clamp(2.2rem, 8vw, 3.5rem);
        }
        .menu-grid {
          grid-template-columns: 1fr;
          gap: 1rem;
        }
        .section-head {
          gap: 1rem;
        }
        .section-name {
          font-size: 1.4rem;
        }
        .popup {
          max-width: 95%;
        }
      }
      @media (max-width: 480px) {
        .menu-hero {
          padding: 6rem 0 2.5rem;
        }
        .card-body {
          padding: 1rem;
        }
        .card-name {
          font-size: 1rem;
        }
        .card-price {
          font-size: 1rem;
        }
        .cat-btn {
          padding: 0.45rem 1rem;
          font-size: 0.65rem;
        }
        .btn-card {
          font-size: 0.64rem;
          padding: 0.55rem 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar" id="navbar">
      <div class="nav-inner">
        <a href="index.html" class="nav-logo"
          ><span class="gold">Italian</span> Pizza Hub</a
        >
        <div class="nav-actions">
          <a href="index.html" class="btn-back">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back Home
          </a>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <header class="menu-hero">
      <span class="hero-label">Curated Menu</span>
      <h1 class="hero-title">Our <em>Kitchen</em></h1>
      <p class="hero-desc">
        Handcrafted dishes made with the finest ingredients, from our kitchen to
        your table.
      </p>
    </header>

    <!-- CATEGORY NAV -->
    <nav class="cat-nav" id="catNav">
      <div class="cat-inner" id="catInner">
        <button class="cat-btn active" data-cat="all">All</button>
        <button class="cat-btn" data-cat="pizza">🍕 Pizza</button>
        <button class="cat-btn" data-cat="pasta">🍝 Pasta</button>
        <button class="cat-btn" data-cat="kebab">🥩 Kebabs</button>
        <button class="cat-btn" data-cat="salad">🥗 Salads</button>
        <button class="cat-btn" data-cat="dessert">🍰 Desserts</button>
        <button class="cat-btn" data-cat="drinks">🥂 Drinks</button>
      </div>
    </nav>

    <!-- MENU -->
    <section class="menu-sections" id="menuSections">
      <div class="container" id="menuContainer">
        <!-- Rendered by JS -->
      </div>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🍽️</div>
        <div class="empty-title">No dishes found</div>
      </div>
    </section>

    <!-- POPUP -->
    <div class="popup-overlay" id="popupOverlay">
      <div class="popup" id="popup"></div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">
      <span class="toast-dot"></span><span id="toastMsg">Added to cart</span>
    </div>

        const cats = [
          { id: "pizza", name: "Pizza", icon: "🍕" },
          { id: "pasta", name: "Pasta", icon: "🍝" },
          { id: "kebab", name: "Kebabs", icon: "🥩" },
          { id: "salad", name: "Salads", icon: "🥗" },

          { id: "drinks", name: "Drinks", icon: "🥂" },
        ];

        let currentCat = "all";

        function renderAll() {
          const container = document.getElementById("menuContainer");
          if (currentCat === "all") {
            container.innerHTML = cats
              .map((c) => {
                const items = menuData.filter((i) => i.cat === c.id);
                return `<div class="menu-section-block" data-cat="${c.id}">
              <div class="section-head"><span class="section-icon">${c.icon}</span><h2 class="section-name">${c.name}</h2><div class="section-line"></div><span class="section-count">${items.length} items</span></div>
              <div class="menu-grid">${items.map((i) => cardHTML(i)).join("")}</div>
            </div>`;
              })
              .join("");
          } else {
            const items = menuData.filter((i) => i.cat === currentCat);
            const c = cats.find((c) => c.id === currentCat);
            container.innerHTML = items.length
              ? `<div class="menu-section-block"><div class="section-head"><span class="section-icon">${c.icon}</span><h2 class="section-name">${c.name}</h2><div class="section-line"></div><span class="section-count">${items.length} items</span></div><div class="menu-grid">${items.map((i) => cardHTML(i)).join("")}</div></div>`
              : "";
          }
          document
            .getElementById("emptyState")
            .classList.toggle("show", !container.innerHTML.trim());
          bindCardEvents();
          animateCards();
        }

        function cardHTML(i) {
          const stars = Array.from(
            { length: i.rating },
            () =>
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>',
          ).join("");
          const badges = i.badges
            .map((b) =>
              b === "top"
                ? '<span class="card-badge badge-top">Top</span>'
                : b === "veg"
                  ? '<span class="card-badge badge-veg">Veg</span>'
                  : b === "hot"
                    ? '<span class="card-badge badge-hot">Hot</span>'
                    : "",
            )
            .join("");
          const tags = i.badges
            .map((b) =>
              b === "veg"
                ? '<span class="card-tag veg-tag">Vegetarian</span>'
                : b === "hot"
                  ? '<span class="card-tag">Spicy</span>'
                  : b === "top"
                    ? '<span class="card-tag">Best Seller</span>'
                    : "",
            )
            .join("");
          return `<div class="menu-card" data-id="${i.id}">
          <div class="card-img"><img src="${i.img}" alt="${i.name}" loading="lazy"><div class="card-badges">${badges}</div><button class="card-fav" data-action="fav" data-id="${i.id}" aria-label="Favorite">♡</button></div>
          <div class="card-body">
            <div class="card-top"><h3 class="card-name">${i.name}</h3><span class="card-price">&pound;${i.price.toFixed(2)}</span></div>
            <p class="card-desc">${i.desc}</p>
            <div class="card-meta"><div class="card-stars">${stars}</div><div class="card-tags">${tags}</div></div>
            <div class="card-actions">
              <button class="btn-card btn-add-card" data-action="add" data-id="${i.id}">Add to Cart</button>
              <button class="btn-card btn-detail-card" data-action="detail" data-id="${i.id}">Details</button>
            </div>
          </div>
        </div>`;
        }

        function bindCardEvents() {
          document.querySelectorAll(".btn-add-card").forEach((b) =>
            b.addEventListener("click", function (e) {
              e.stopPropagation();
              addToCart(parseInt(this.dataset.id), this);
            }),
          );
          document.querySelectorAll(".btn-detail-card").forEach((b) =>
            b.addEventListener("click", function (e) {
              e.stopPropagation();
              openPopup(parseInt(this.dataset.id));
            }),
          );
          document.querySelectorAll(".card-fav").forEach((b) =>
            b.addEventListener("click", function (e) {
              e.stopPropagation();
              this.textContent = this.textContent === "♡" ? "♥" : "♡";
              this.style.color = this.textContent === "♥" ? "#e74c3c" : "";
            }),
          );
        }

        function animateCards() {
          if (
            typeof gsap !== "undefined" &&
            typeof ScrollTrigger !== "undefined"
          ) {
            gsap.utils.toArray(".menu-card").forEach((card, i) => {
              gsap.to(card, {
                opacity: 1,
                y: 0,
                duration: 0.6,
                delay: i * 0.05,
                ease: "power3.out",
                scrollTrigger: {
                  trigger: card,
                  start: "top 92%",
                  toggleActions: "play none none none",
                },
              });
            });
          } else {
            document.querySelectorAll(".menu-card").forEach((c) => {
              c.style.opacity = "1";
              c.style.transform = "translateY(0)";
            });
          }
        }

        function addToCart(id, btn) {
          const item = menuData.find((i) => i.id === id);
          if (!item) return;
          const existing = cart.find((i) => i.id === id);
          existing
            ? existing.qty++
            : cart.push({ id, name: item.name, price: item.price, qty: 1 });
          showToast(`${item.name} added`);
          if (btn) {
            btn.classList.add("added");
            btn.textContent = "✓ Added";
            setTimeout(() => {
              btn.classList.remove("added");
              btn.textContent = "Add to Cart";
            }, 2000);
          }
        }

        function openPopup(id) {
          const i = menuData.find((x) => x.id === id);
          if (!i) return;
          const popup = document.getElementById("popup");
          popup.innerHTML = `
          <button class="popup-close" id="popupClose">✕</button>
          <div class="popup-img"><img src="${i.img}" alt="${i.name}"></div>
          <div class="popup-body">
            <div class="popup-cat">${i.cat}</div>
            <h2 class="popup-name">${i.name}</h2>
            <div class="popup-rating"><div class="popup-stars">${Array.from({ length: i.rating }, () => '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>').join("")}</div><span class="popup-reviews">${i.reviews} reviews</span></div>
            <p class="popup-desc">${i.full}</p>
            <div class="popup-info">
              <div class="popup-info-item"><div class="popup-info-label">Calories</div><div class="popup-info-value">${i.cal} kcal</div></div>
              <div class="popup-info-item"><div class="popup-info-label">Prep Time</div><div class="popup-info-value">${i.time}</div></div>
              <div class="popup-info-item"><div class="popup-info-label">Spice Level</div><div class="popup-info-value">${i.spice}</div></div>
              <div class="popup-info-item"><div class="popup-info-label">Portion</div><div class="popup-info-value">Regular / Large</div></div>
            </div>
            <div class="popup-footer">
              <span class="popup-price">&pound;${i.price.toFixed(2)}</span>
              <div class="popup-qty"><button class="qty-btn-popup" data-action="dec">−</button><span class="qty-val">1</span><button class="qty-btn-popup" data-action="inc">+</button></div>
              <button class="btn-popup-add" data-id="${i.id}">Add to Cart</button>
            </div>
          </div>`;
          document
            .getElementById("popupClose")
            .addEventListener("click", closePopup);
          popup.querySelectorAll(".qty-btn-popup").forEach((b) =>
            b.addEventListener("click", function () {
              const val = popup.querySelector(".qty-val");
              let v = parseInt(val.textContent);
              if (this.dataset.action === "inc") v++;
              else if (v > 1) v--;
              val.textContent = v;
            }),
          );
          popup
            .querySelector(".btn-popup-add")
            .addEventListener("click", function () {
              const qty = parseInt(popup.querySelector(".qty-val").textContent);
              const existing = cart.find((x) => x.id === id);
              existing
                ? (existing.qty += qty)
                : cart.push({ id, name: i.name, price: i.price, qty });
              showToast(`${i.name} added`);
              this.classList.add("added");
              this.textContent = "✓ Added";
              setTimeout(() => {
                this.classList.remove("added");
                this.textContent = "Add to Cart";
              }, 2000);
            });
          document.getElementById("popupOverlay").classList.add("active");
          document.body.style.overflow = "hidden";
        }

        function closePopup() {
          document.getElementById("popupOverlay").classList.remove("active");
          document.body.style.overflow = "";
        }

        function showToast(msg) {
          document.getElementById("toastMsg").textContent = msg;
          document.getElementById("toast").classList.add("active");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(
            () => document.getElementById("toast").classList.remove("active"),
            2500,
          );
        }

        // Category buttons
        document.querySelectorAll(".cat-btn").forEach((btn) => {
          btn.addEventListener("click", function () {
            document
              .querySelectorAll(".cat-btn")
              .forEach((b) => b.classList.remove("active"));
            this.classList.add("active");
            currentCat = this.dataset.cat;
            renderAll();
          });
        });

        // Navbar scroll
        window.addEventListener(
          "scroll",
          () => {
            document
              .getElementById("navbar")
              .classList.toggle("scrolled", window.scrollY > 50);
            document
              .getElementById("catNav")
              .classList.toggle("scrolled", window.scrollY > 50);
          },
          { passive: true },
        );

        // Popup overlay click
        document
          .getElementById("popupOverlay")
          .addEventListener("click", function (e) {
            if (e.target === this) closePopup();
          });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") closePopup();
        });

        renderAll();
      })();
    </script>
